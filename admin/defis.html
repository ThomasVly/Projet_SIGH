<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Gestion des Défis | SIGH</title>
    <meta name="description" content="Interface d'administration pour la gestion des défis SIGH">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <a href="index.html" class="back-link">← Retour</a>
                <div class="logo">
                    <span class="logo-icon">🏆</span>
                    <h1>SIGH Admin</h1>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Add Défi Form -->
            <section class="card form-section">
                <div class="card-header">
                    <h2>✨ Ajouter un nouveau défi</h2>
                </div>
                <form id="defiForm" class="conseil-form">
                    <div class="form-group">
                        <label for="title">Titre</label>
                        <input type="text" id="title" name="title" required placeholder="Titre du défi">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3" required
                            placeholder="Description du défi"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="monthLabel">Mois du défi</label>
                            <input type="month" id="monthLabel" name="monthLabel" required>
                        </div>
                        <div class="form-group">
                            <label for="reward">Récompense (points)</label>
                            <input type="number" id="reward" name="reward" required min="0" placeholder="Ex: 100">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reminder">Rappel</label>
                        <input type="text" id="reminder" name="reminder" required
                            placeholder="Message de rappel pour le défi">
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span class="btn-text">Ajouter le défi</span>
                        <span class="btn-loader" style="display: none;">⏳</span>
                    </button>
                </form>
            </section>

            <!-- Défis List -->
            <section class="card list-section">
                <div class="card-header">
                    <h2>🎯 Liste des défis</h2>
                    <button class="btn btn-secondary" id="refreshBtn">🔄 Actualiser</button>
                </div>
                <div id="defisList" class="conseils-list">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Chargement des défis...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast Notifications -->
        <div id="toast" class="toast"></div>
    </div>

    <!-- Firebase SDK (compat version for no-server usage) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="defis.js"></script>
</body>

</html>
